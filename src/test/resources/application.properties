# ============================================================
# Test-only config. Overrides src/main/resources/application.properties
# whenever tests run, so the suite needs no MySQL and no real secrets.
# ============================================================

# ------------------------------------------------------------
# In-memory H2 instead of MySQL.
# MODE=MySQL makes H2 accept MySQL-flavoured SQL; create-drop rebuilds
# the schema per run, so tests can never corrupt your dev database.
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database=h2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# ------------------------------------------------------------
# Throwaway values so @Value placeholders resolve.
# This secret is a random base64 string generated for tests only —
# it is NOT the production key and must never be reused as one.
# ------------------------------------------------------------
jwt.secret=S+2Gk28DrinQDteilJDXC86BRRytwRS57rJxtE9Yi+I=
jwt.expiration=86400000
admin.email=admin@gamestore.com

# Quieter test output than the main config
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
