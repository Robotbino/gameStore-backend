# ============================================================
# Server
# ============================================================
server.port=8181
# ============================================================
# MySQL Connection
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/gamestore_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# Flyway
# ------------------------------------------------------------
# Flyway now owns the schema. Migrations live in
# src/main/resources/db/migration/ and run at startup.
#
# baseline-on-migrate stamps any pre-existing database (dev,
# staging, the deployed instance — all built by the old
# ddl-auto=update era) at V1 without running V1__baseline.sql
# against it. A fresh environment with an empty schema WILL
# run V1 and build the tables from zero.
# ============================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ============================================================
# JPA / Hibernate
# ------------------------------------------------------------
# ddl-auto=validate — Hibernate no longer touches the schema;
# it only checks that every @Entity matches the tables Flyway
# built. Any drift fails startup instead of silently altering
# the database.
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================================
# Pagination
# ------------------------------------------------------------
# Cap ?size= so a client can't defeat pagination by asking for
# the whole table in one page — the exact regression B10 was
# fixing. 100 rows is a generous single-page ceiling for both
# /games/all and /users/all; requests above it are silently
# clamped.
# ============================================================
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20
# ============================================================
# Logging
# ============================================================
logging.level.com.gameStore.Bino=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
logging.level.org.springframework.security=DEBUG

# ============================================================
# JWT Configuration
# ============================================================
# Generate your own key: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# ============================================================
# Admin Email
# ============================================================
# Any account registered with this email gets ADMIN role.
# Everyone else gets USER role automatically.
admin.email=admin@gamestore.com